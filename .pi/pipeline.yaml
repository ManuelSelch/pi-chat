prepare:
  command: [npm, ci, --ignore-scripts]
  cwd: .
  timeoutSeconds: 300
suites:
  lint:
    command: [npm, run, lint]
    cwd: .
    timeoutSeconds: 300
    auto: after-agent
  tooling:
    command: [npm, run, test:tooling]
    cwd: .
    timeoutSeconds: 300
    auto: after-agent
  build:
    command: [npm, run, build]
    cwd: .
    timeoutSeconds: 300
    auto: after-agent
  unit:
    command: [npm, test]
    cwd: .
    timeoutSeconds: 300
    auto: after-agent
  packages:
    cwd: .
    timeoutSeconds: 600
    auto: after-agent
    jobs:
      build:
        command: [npm, run, build:packages]
      typecheck:
        command: [npm, run, typecheck:packages]
      tests:
        command: [npm, run, test:packages]
      coverage:
        command: [npm, run, test:packages:coverage]
      artifacts:
        command: [npm, run, verify:packages]
      protocol:
        command: [npm, run, verify:protocol]
  e2e:
    command: [npm, run, test:e2e]
    cwd: .
    timeoutSeconds: 600
    auto: manual
  production-smoke:
    command: [npm, run, test:production-smoke]
    cwd: .
    timeoutSeconds: 300
    auto: manual
