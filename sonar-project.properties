sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info,coverage-packages/lcov.info
# Workspace reports are normalized to repository-relative package paths.
sonar.coverage.exclusions=examples/**,extension/**,mockups/**,scripts/**,**/scripts/**,**/*.config.*
# SonarCloud's current scope ignores sonar.test.inclusions; do not count tests as production.
sonar.exclusions=mockups/**,testing/**,**/__test__/**,packages/**/test/**,**/dist/**,**/node_modules/**,**/coverage/**,coverage-packages/**