sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info
# Independent server and SDK coverage belongs to their repositories.
sonar.coverage.exclusions=examples/**,extension/**,mockups/**,scripts/**,*.config.*
# SonarCloud's current scope ignores sonar.test.inclusions; do not count tests as production.
sonar.exclusions=mockups/**,testing/**,**/__test__/**