<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick switcher · Slice 2</title><link rel="stylesheet" href="./styles.css"></head>
<body>
  <main><button id="reopen">Open quick switcher · ⌘O</button><button id="theme">Toggle light / dark</button><p id="notice" aria-live="polite"></p></main>
  <dialog open aria-label="Quick switcher"><div class="palette">
    <input id="search" autofocus autocomplete="off" aria-label="Search folders, worktrees, sessions and actions" placeholder="Search folders, worktrees, sessions and actions…">
    <div class="scopes" aria-label="Search scopes"><button data-scope="">All</button><button data-scope="#"># Folders</button><button data-scope="%">% Worktrees</button><button data-scope="@">@ Sessions</button><button data-scope="/">/ Actions</button></div>
    <div id="results" role="listbox" aria-label="Folders, worktrees, sessions and actions"></div>
    <footer>↑↓ to move · Enter to open · Esc to close</footer>
  </div></dialog><script type="module" src="./main.js"></script>
</body></html>
