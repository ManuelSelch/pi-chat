name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm run test:tooling

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build workspace with browser source maps
        run: npm run build
        env:
          PI_CHAT_COVERAGE: '1'
      - name: Verify production launcher and restart lifecycle
        working-directory: packages/pi-chat
        run: node scripts/production-server-smoke.mjs
        env:
          PI_CHAT_COVERAGE: '1'
      - uses: actions/upload-artifact@v6
        with:
          name: build
          path: packages/pi-chat/dist/
          if-no-files-found: error
          retention-days: 7

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - run: npm run typecheck:packages
      - run: npm run test:packages
      - run: npm run test:packages:coverage
      - run: npm run verify:packages
      - run: npm run verify:protocol
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-packages
          path: coverage-packages/lcov.info
          if-no-files-found: error
          retention-days: 7

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep aligned with Playwright in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:packages && npm run build:harness -w pi-chat
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: packages/pi-chat/dist/
      - name: Run browser and Chat-worker coverage against downloaded assets
        run: npm run test:e2e:coverage:run
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-e2e
          path: coverage-e2e/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: packages/pi-chat/test-results/
          if-no-files-found: ignore
          retention-days: 7

  sonar:
    needs: [unit, e2e, packages]
    if: >-
      vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: actions/download-artifact@v8
        with:
          name: coverage-e2e
          path: coverage-e2e
      - uses: actions/download-artifact@v8
        with:
          name: coverage-packages
          path: coverage-packages
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
